name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build web as Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:workspace

      - name: Build web app
        run: pnpm --filter @ryx/web build

      - name: Build Windows installer
        run: pnpm --filter @ryx/windows run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rongyixing-windows-x64
          path: |
            apps/windows/release/*.exe
            apps/windows/release/*.blockmap
          if-no-files-found: error
