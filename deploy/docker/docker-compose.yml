services:
  ryx-h5:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.h5
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        VITE_APP_ID: ${VITE_APP_ID:-com.ronglvonline.app}
        VITE_API_MODE: ${VITE_API_MODE:-proxy}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_DOMAIN: ${VITE_API_DOMAIN:-rtesp.com}
    image: ryx-h5:latest
    container_name: ryx-h5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RYX_H5_PORT:-18080}:80"
