worker_processes 1;

error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 18080;
        server_name localhost 127.0.0.1 app.rongtrip.cn;

        root /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/.local/nginx-prod-like/wwwroot;

        location = / {
            return 302 /www/index.html;
        }

        location /www/ {
            try_files $uri $uri/ /www/index.html;
        }

        location /__ryx/ {
            proxy_pass https://app.rongtrip.cn;
            proxy_ssl_server_name on;
            proxy_set_header Host app.rongtrip.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        include /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/deploy/release/nginx/rongyixing-proxy-locations.conf.template;

        location / {
            proxy_pass https://app.rongtrip.cn;
            proxy_ssl_server_name on;
            proxy_set_header Host app.rongtrip.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }
    }
}
