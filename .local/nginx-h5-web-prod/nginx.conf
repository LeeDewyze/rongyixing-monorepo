worker_processes  1;
daemon off;

error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /opt/homebrew/etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log logs/access.log;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  server {
    listen 18088;
    server_name localhost 127.0.0.1;

    index index.html;

    location ^~ /assets/ {
      alias /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/apps/h5/dist/assets/;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/apps/h5/dist;
      try_files $uri $uri/ /index.html;
    }

    include /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/.local/nginx-h5-web-prod/prod-proxy.conf;
  }

  server {
    listen 18089;
    server_name localhost 127.0.0.1;

    index index.html;

    location ^~ /assets/ {
      alias /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/apps/web/dist/assets/;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/apps/web/dist;
      try_files $uri $uri/ /index.html;
    }

    include /Users/jiangjiankang/work/self/rongyixing/rongyixing-monorepo/.local/nginx-h5-web-prod/prod-proxy.conf;
  }
}
